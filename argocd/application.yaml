apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: laravel-stack
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/saraTharwat666/Laravel-K8s-test.git   #Repo URL
    targetRevision: HEAD     # updated Commits
    path: helm/laravel-stack  # HELM PATH

  destination:
    server: https://kubernetes.default.svc 
    namespace: laravel

  syncPolicy:
    automated:
      prune: true  
      selfHeal: true  
    syncOptions:
      - CreateNamespace=true