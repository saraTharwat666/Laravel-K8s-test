apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uptime-kuma-pvc
  namespace: {{ .Values.namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.uptimeKuma.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.uptimeKuma.replicas }}
  selector:
    matchLabels:
      app: uptime-kuma
  template:
    metadata:
      labels:
        app: uptime-kuma
    spec:
      containers:
        - name: uptime-kuma
          image: {{ .Values.uptimeKuma.image }}
          ports:
            - containerPort: 3001
          volumeMounts:
            - name: uptime-kuma-storage
              mountPath: /app/data
      volumes:
        - name: uptime-kuma-storage
          persistentVolumeClaim:
            claimName: uptime-kuma-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: uptime-kuma
  namespace: {{ .Values.namespace }}
spec:
  type: NodePort
  selector:
    app: uptime-kuma
  ports:
    - port: 3001
      targetPort: 3001
      nodePort: 30031