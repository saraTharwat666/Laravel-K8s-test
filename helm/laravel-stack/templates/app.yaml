apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.app.replicas }}
  selector:
    matchLabels:
      app: laravel
  template:
    metadata:
      labels:
        app: laravel
    annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorpa.com/role: "laravel"
        vault.hashicorp.com/agent-inject-secret-db: "secret/data/laravel/db"
        vault.hashicorp.com/agent-inject-template-db: |
          {{`{{- with secret "secret/data/laravel/db" -}}`}}
          export DB_PASSWORD="{{`{{ .Data.data.password }}`}}"
          export DB_USERNAME="{{`{{ .Data.data.username }}`}}"
          export DB_DATABASE="{{`{{ .Data.data.name }}`}}"
          {{`{{- end }}`}}
    spec:
      containers:
        - name: app
          image: {{ .Values.app.image }}
          imagePullPolicy: {{ .Values.app.imagePullPolicy }}
          ports:
            - containerPort: 9000
          env:
            - name: APP_ENV
              value: "local"
            - name: APP_DEBUG
              value: "true"
            - name: APP_KEY
              value: {{ .Values.app.key }}
            - name: DB_CONNECTION
              value: "pgsql"
            - name: DB_HOST
              value: "postgres"
            - name: DB_PORT
              value: "5432"
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: CACHE_STORE
              value: "redis"
            - name: SESSION_DRIVER
              value: "redis"
            - name: QUEUE_CONNECTION
              value: "redis"
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: laravel
  namespace: {{ .Values.namespace }}
spec:
  type: NodePort
  selector:
    app: laravel
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080